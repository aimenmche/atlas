<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070b10">
  <meta name="description" content="Atlas — a local-first autonomous data analyst.">
  <title>Atlas · data intelligence</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="grid-veil"></div>
  </div>

  <div id="app" class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Workspace"></aside>
    <main class="main">
      <header id="topbar" class="topbar"></header>
      <nav id="tabs" class="tabs" aria-label="Dataset views"></nav>
      <div id="filters" class="filter-bar" aria-label="Segment filters"></div>
      <div id="view" class="view" tabindex="-1"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="palette-root"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="boot" class="boot">
    <div class="boot-mark">A</div>
    <div class="boot-line"><span></span></div>
    <div class="boot-text">Waking the analyst</div>
  </div>

  <script src="/static/charts.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
