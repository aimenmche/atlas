name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,excel]"

      - name: Test with coverage
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest --cov=atlas --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

      - name: Compile
        run: python -m compileall -q atlas

      - name: NL→SQL benchmark
        run: python benchmarks/run.py

      - name: JavaScript syntax
        if: matrix.python-version == '3.13'
        run: |
          node --check atlas/static/app.js
          node --check atlas/static/charts.js
          node --check atlas/static/landing.js
          node --check atlas/static/boot.js

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: pip install -e ".[dev,excel]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install axe-core
        run: npm install --no-audit --no-fund

      - name: Frontend unit tests
        run: npm test

      - name: Browser, accessibility and print tests
        env:
          ATLAS_E2E: "1"
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/e2e -q

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: artifacts/e2e
          if-no-files-found: ignore

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,excel]"

      - name: Core tests on ${{ matrix.os }}
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/test_api.py tests/test_store.py tests/test_security.py tests/test_platform.py -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t atlas:ci .

      - name: Run container
        run: docker run -d --name atlas-ci -p 8080:8080 atlas:ci

      - name: Wait for health and smoke the landing page
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          curl --fail --silent http://127.0.0.1:8080/ | grep -q "Your data has a shape"

      - name: Container logs
        if: failure()
        run: docker logs atlas-ci

      - name: Stop container
        if: always()
        run: docker rm -f atlas-ci

  audit:
    runs-on: ubuntu-latest
    # Report-only until the first triage pass. Remove continue-on-error to make
    # a known advisory block merges once the baseline is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Dependency audit
        run: pip-audit --desc
